name: CI / Risk Gate v2
on:
  pull_request: { branches: [main] }
  push: { branches: [main] }
permissions: { contents: read }
concurrency:
  group: risk-gate-v2-${{ github.ref }}
  cancel-in-progress: true
env: { CI: true, NEXT_TELEMETRY_DISABLED: 1 }

jobs:
  classify:
    name: Change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base-sha: ${{ steps.plan.outputs.base-sha }}
      head-sha: ${{ steps.plan.outputs.head-sha }}
      required-gates: ${{ steps.plan.outputs.required-gates }}
      mobile: ${{ steps.plan.outputs.mobile }}
      web: ${{ steps.plan.outputs.web }}
      admin: ${{ steps.plan.outputs.admin }}
      shared: ${{ steps.plan.outputs.shared }}
      user: ${{ steps.plan.outputs.user }}
      world: ${{ steps.plan.outputs.world }}
      decision: ${{ steps.plan.outputs.decision }}
      database: ${{ steps.plan.outputs.database }}
      delivery-policy: ${{ steps.plan.outputs.delivery-policy }}
      release-certification: ${{ steps.plan.outputs.release-certification }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
          CANONICAL_MAIN_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          node scripts/ci/classify-change.mjs --event-name "$EVENT_NAME" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --checkout-sha "$CHECKOUT_SHA" --canonical-main-ref "$CANONICAL_MAIN_REF" --output "$RUNNER_TEMP/change-plan.json"
          node - "$RUNNER_TEMP/change-plan.json" "$GITHUB_OUTPUT" <<'NODE'
          const { appendFileSync, readFileSync } = require("node:fs");
          const plan = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const selected = new Set(plan.requiredGates);
          const gates = ["mobile", "web", "admin", "shared", "user", "world", "decision", "database", "delivery-policy", "release-certification"];
          appendFileSync(process.argv[3], [`base-sha=${plan.context.baseSha}`, `head-sha=${plan.context.headSha}`, `required-gates=${JSON.stringify(plan.requiredGates)}`, ...gates.map((gate) => `${gate}=${selected.has(gate)}`)].join("\n") + "\n");
          NODE

  repository-security:
    name: Repository and secret invariants
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - env: { CI_BASE_SHA: "${{ github.event.pull_request.base.sha || github.event.before }}" }
        run: scripts/ci/repository-sanity.sh
      - run: scripts/ci/scan-canonical-secrets.sh
      - run: node scripts/ci/validate-client-secret-boundary.mjs
      - run: node scripts/ci/validate-production-state.mjs
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env: { GITHUB_TOKEN: "${{ github.token }}", GITLEAKS_ENABLE_COMMENTS: "false", GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false" }

  mobile:
    name: Mobile focused gate
    if: needs.classify.outputs.mobile == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run lint
      - name: TypeScript baseline
        continue-on-error: true
        run: npm run typecheck

  web:
    name: Web focused gate
    if: needs.classify.outputs.web == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: { NEXT_PUBLIC_SUPABASE_URL: "https://example.invalid", NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-public-placeholder", NEXT_PUBLIC_SITE_URL: "https://example.invalid", NEXT_PUBLIC_APP_DOWNLOAD_URL: "https://example.invalid" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm run test:contracts --workspace web
      - run: npm run typecheck --workspace web -- --pretty false
      - run: npm run build --workspace web

  admin:
    name: Admin focused gate
    if: needs.classify.outputs.admin == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults: { run: { working-directory: admin-dashboard } }
    env: { NEXT_PUBLIC_SUPABASE_URL: "https://example.invalid", NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-public-placeholder", NEXT_PUBLIC_SITE_URL: "https://example.invalid", NEXT_PUBLIC_GOOGLE_API_KEY: "ci-public-placeholder", SUPABASE_SERVICE_ROLE_KEY: "ci-server-placeholder" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm, cache-dependency-path: admin-dashboard/package-lock.json }
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run typecheck
      - run: npm run build

  shared:
    name: Shared contracts
    if: needs.classify.outputs.shared == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm exec tsc -- --noEmit --pretty false -p packages/shared/tsconfig.json

  user:
    name: User Intelligence focused gate
    if: needs.classify.outputs.user == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm run user-intelligence-vnext:typecheck
      - run: npm run user-intelligence-vnext:test

  world:
    name: World Knowledge focused gate
    if: needs.classify.outputs.world == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm run world-knowledge:typecheck
      - run: npm run world-knowledge:test

  decision:
    name: Decision vNext focused gate
    if: needs.classify.outputs.decision == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm run decision-vnext:typecheck
      - run: npm run decision-vnext:test
      - run: npm run decision-vnext:single-route

  database:
    name: Database clean boot and authorization
    if: needs.classify.outputs.database == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with: { version: 2.80.0 }
      - env: { BASE_SHA: "${{ needs.classify.outputs.base-sha }}", HEAD_SHA: "${{ needs.classify.outputs.head-sha }}" }
        run: |
          node scripts/ci/validate-database-lineage.mjs --base-sha "$BASE_SHA"
          node scripts/ci/validate-database-test-coverage.mjs --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --output "$RUNNER_TEMP/database-tests.txt"
          node --test scripts/ci/validate-database-lineage.test.mjs scripts/ci/validate-database-test-coverage.test.mjs scripts/ci/validate-database-release.test.mjs
      - env: { BASE_SHA: "${{ needs.classify.outputs.base-sha }}", BACKYRD_CHANGED_DATABASE_TESTS_FILE: "${{ runner.temp }}/database-tests.txt" }
        run: scripts/ci/validate-supabase-current.sh

  delivery-policy:
    name: Delivery policy v2
    if: needs.classify.outputs.delivery-policy == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci --ignore-scripts
      - run: node --test scripts/ci/resolve-change-context.test.mjs scripts/ci/classify-change.test.mjs scripts/ci/verify-risk-gate.test.mjs scripts/ci/delivery-workflow-v2.test.mjs scripts/ci/validate-client-secret-boundary.test.mjs scripts/ci/validate-production-state.test.mjs
      - run: node --test scripts/deployment/supabase-production-plan.test.mjs scripts/deployment/verify-manual-production-release.test.mjs scripts/deployment/verify-supabase-migration-dry-run.test.mjs scripts/deployment/deploy-supabase-production-contract.test.mjs

  release-certification:
    name: Product release certification
    if: needs.classify.outputs.release-certification == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm run decision-vnext:single-route
      - run: node --test supabase/functions/decision-founder-live/runtime-boundary.test.mjs
      - run: npm run founder-live:test
      - run: npx playwright install chromium
      - run: npm run founder-live:e2e
      - name: Build installed Mobile path
        working-directory: mobile
        env: { EXPO_PUBLIC_SUPABASE_URL: "https://example.invalid", EXPO_PUBLIC_SUPABASE_ANON_KEY: "ci-public-placeholder-key-000000000000" }
        run: npm ci && npx expo export --platform web --output-dir "$RUNNER_TEMP/mobile-web"

  risk-gate:
    name: Risk-based merge gate
    if: always()
    needs: [classify, repository-security, mobile, web, admin, shared, user, world, decision, database, delivery-policy, release-certification]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUIRED_GATES: ${{ needs.classify.outputs.required-gates }}
      RESULTS: >-
        {"repository-security":"${{ needs.repository-security.result }}","mobile":"${{ needs.mobile.result }}","web":"${{ needs.web.result }}","admin":"${{ needs.admin.result }}","shared":"${{ needs.shared.result }}","user":"${{ needs.user.result }}","world":"${{ needs.world.result }}","decision":"${{ needs.decision.result }}","database":"${{ needs.database.result }}","delivery-policy":"${{ needs.delivery-policy.result }}","release-certification":"${{ needs.release-certification.result }}"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: node scripts/ci/verify-risk-gate.mjs --required-gates "$REQUIRED_GATES" --results "$RESULTS"
