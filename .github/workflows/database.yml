name: CI / Database

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-database:
    name: Canonical database boot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Node.js for lockfile installation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # Later CLIs select postgres images .104-.106 whose supautils denial
          # path SIGSEGVs for the reserved anon/authenticated roles. Keep the
          # runtime denial tests real and fail-closed on verified image .095.
          version: 2.80.0
      - name: Validate immutable migration lineage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if test -n "$BASE_SHA"; then
            node scripts/ci/validate-database-lineage.mjs --base-sha "$BASE_SHA"
          else
            node scripts/ci/validate-database-lineage.mjs
          fi
          node --test scripts/ci/validate-database-lineage.test.mjs
          node --test scripts/ci/validate-lockfile-install.test.mjs
      - name: Validate isolated canonical database
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/validate-supabase-local.sh
      - name: Validate shipped Product lineage
        run: scripts/ci/validate-production-lineage.sh
