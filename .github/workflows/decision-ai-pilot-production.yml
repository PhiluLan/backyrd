name: Decision AI Evaluation Production Control

on:
  workflow_dispatch:
    inputs:
      mode:
        description: ENABLE_ONE_ACCOUNT, ENABLE_EVAL_COHORT or EMERGENCY_OFF
        required: true
        type: choice
        options:
          - ENABLE_ONE_ACCOUNT
          - ENABLE_EVAL_COHORT
          - EMERGENCY_OFF
      canonical_main_sha:
        description: Exact current Main SHA for enablement
        required: true
        type: string
      deployment_run_id:
        description: Successful Supabase Production run for the pilot source
        required: true
        type: string
      confirmation:
        description: Type the selected mode exactly
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: decision-ai-pilot-production
  cancel-in-progress: false

jobs:
  control:
    name: Bound evaluation cohort or emergency off
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.canonical_main_sha }}
      - name: Validate manual authority and current Main
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUESTED_SHA: ${{ inputs.canonical_main_sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = "$MODE"
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          if test "$MODE" = ENABLE_ONE_ACCOUNT || test "$MODE" = ENABLE_EVAL_COHORT; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            test "$(git rev-parse refs/remotes/origin/main)" = "$REQUESTED_SHA"
          else
            test "$MODE" = EMERGENCY_OFF
          fi
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.98.2
      - name: Bind current Main to the audited shipped source
        if: inputs.mode == 'ENABLE_ONE_ACCOUNT' || inputs.mode == 'ENABLE_EVAL_COHORT'
        id: shipped
        env:
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
        run: |
          node scripts/ci/validate-production-state.mjs
          source_sha="$(jq -r '.supabase.shippedSourceSha' delivery/production-state.json)"
          expected_run="$(jq -r '.supabase.deploymentRunId' delivery/production-state.json)"
          test "$DEPLOYMENT_RUN_ID" = "$expected_run"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Download exact Production deployment audit
        if: inputs.mode == 'ENABLE_ONE_ACCOUNT' || inputs.mode == 'ENABLE_EVAL_COHORT'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: supabase-production-${{ steps.shipped.outputs.source_sha }}
          path: ${{ runner.temp }}/deployment-audit
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.deployment_run_id }}
      - name: Verify deployed source, model key and exact pilot scope
        if: inputs.mode == 'ENABLE_ONE_ACCOUNT' || inputs.mode == 'ENABLE_EVAL_COHORT'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AUDIT_DIR: ${{ runner.temp }}/deployment-audit
          DEPLOYED_SOURCE_SHA: ${{ steps.shipped.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          jq -e --arg sha "$DEPLOYED_SOURCE_SHA" '.result == "PASS" and .canonicalMainSha == $sha' "$AUDIT_DIR/result.json" >/dev/null
          expected_bundle="$(jq -r '.[] | select(.slug == "decision-v13") | .ezbr_sha256' "$AUDIT_DIR/functions-after.json")"
          test -n "$expected_bundle"
          supabase functions list --project-ref hjgcrrzfjchzqoegcywn --output json > "$RUNNER_TEMP/functions-live.json"
          jq -e --arg digest "$expected_bundle" '.[] | select(.slug == "decision-v13" and .status == "ACTIVE" and .verify_jwt == true and .ezbr_sha256 == $digest)' "$RUNNER_TEMP/functions-live.json" >/dev/null
          supabase secrets list --project-ref hjgcrrzfjchzqoegcywn --output json > "$RUNNER_TEMP/secret-names.json"
          jq -e 'any(.[]; .name == "OPENAI_API_KEY")' "$RUNNER_TEMP/secret-names.json" >/dev/null
      - name: Enable only the verified evaluation accounts
        if: inputs.mode == 'ENABLE_ONE_ACCOUNT' || inputs.mode == 'ENABLE_EVAL_COHORT'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          allowlist=97062df5-f2ba-40b1-b170-015669a09713
          if test "$MODE" = ENABLE_EVAL_COHORT; then
            allowlist="$allowlist,6b31c2d2-6b2b-45bb-a7e0-ffbd0cdbea6f"
          fi
          supabase secrets set --project-ref hjgcrrzfjchzqoegcywn \
            BACKYRD_DECISION_AI_INTENT_MODEL=gpt-6-luna \
            BACKYRD_DECISION_AI_INTENT_USER_ALLOWLIST="$allowlist"
          if ! supabase secrets set --project-ref hjgcrrzfjchzqoegcywn BACKYRD_DECISION_AI_INTENT_ENABLED=true; then
            supabase secrets set --project-ref hjgcrrzfjchzqoegcywn BACKYRD_DECISION_AI_INTENT_ENABLED=false || true
            exit 1
          fi
          echo "EVALUATION_CONFIGURED_${MODE}_PROVIDER_NOT_YET_VERIFIED" >> "$GITHUB_STEP_SUMMARY"
      - name: Emergency off
        if: inputs.mode == 'EMERGENCY_OFF'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase secrets set --project-ref hjgcrrzfjchzqoegcywn BACKYRD_DECISION_AI_INTENT_ENABLED=false
          echo 'DECISION_AI_INTENT_DISABLED' >> "$GITHUB_STEP_SUMMARY"
