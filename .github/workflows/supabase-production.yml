name: Supabase Production Deployment

on:
  workflow_dispatch:
    inputs:
      canonical_main_sha:
        description: Exact canonical Main candidate SHA to release (tip or immutable ancestor)
        required: true
        type: string
      release_confirmation:
        description: Type DEPLOY_SUPABASE_PRODUCTION to authorize the bound release
        required: true
        type: string
      certification_run_id:
        description: GitHub Actions run that produced the exact tested Product artifact
        required: true
        type: string
      release_manifest_hash:
        description: SHA-256 manifest identity printed by Product release certification
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deployment-contract:
    name: Source-aware deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.canonical_main_sha || github.sha }}
      - name: Refresh canonical main identity
        if: github.event_name == 'workflow_dispatch'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Require a recent green deep recertification
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          latest="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deep-recertification.yml --branch main --limit 1 --json conclusion,status,createdAt,databaseId)"
          test "$(jq 'length' <<<"$latest")" -eq 1
          test "$(jq -r '.[0].status' <<<"$latest")" = completed
          test "$(jq -r '.[0].conclusion' <<<"$latest")" = success
          node - "$(jq -r '.[0].createdAt' <<<"$latest")" <<'NODE'
          const age = Date.now() - Date.parse(process.argv[2]);
          if (!Number.isFinite(age) || age > 8 * 24 * 60 * 60 * 1000) process.exit(1);
          NODE
      - name: Download the exact CI-certified Product artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backyrd-product-release-${{ inputs.canonical_main_sha }}
          path: ${{ runner.temp }}/product-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.certification_run_id }}
      - name: Verify build-once/deploy-same-artifact identity
        run: node scripts/ci/product-release-manifest.mjs verify --artifact "$RUNNER_TEMP/product-release" --expected-hash "${{ inputs.release_manifest_hash }}" --expected-source-sha "${{ inputs.canonical_main_sha }}" --expected-mode POST_MERGE_MAIN --checkout-root "$GITHUB_WORKSPACE"
      - name: Verify explicit manual release authority
        if: github.event_name == 'workflow_dispatch'
        id: manual_release
        run: |
          node scripts/deployment/verify-manual-production-release.mjs \
            --event-name "$GITHUB_EVENT_NAME" \
            --requested-sha "${{ inputs.canonical_main_sha }}" \
            --confirmation "${{ inputs.release_confirmation }}" \
            --output manual-production-release.json
          echo "base_sha=$(jq -r '.baseSha' manual-production-release.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.98.2
      - name: Verify fail-closed deployment planner
        run: node --test scripts/deployment/supabase-production-plan.test.mjs scripts/deployment/verify-manual-production-release.test.mjs scripts/deployment/verify-supabase-migration-dry-run.test.mjs scripts/deployment/verify-already-applied-product-migrations.test.mjs scripts/deployment/deploy-supabase-production-contract.test.mjs scripts/ci/validate-production-state.test.mjs
      - name: Validate shipped Production baseline
        run: node scripts/ci/validate-production-state.mjs
      - name: Build auditable deployment plan
        env:
          AUTHORIZED_BASE_SHA: ${{ steps.manual_release.outputs.base_sha }}
        run: |
          base_sha="$AUTHORIZED_BASE_SHA"
          if test -z "$base_sha"; then
            base_sha="$(jq -r '.supabase.shippedSourceSha' delivery/production-state.json)"
          fi
          node scripts/deployment/supabase-production-plan.mjs --base-sha "$base_sha" --head-sha HEAD --output supabase-production-plan.json
      - name: Publish plan summary
        run: |
          release_state="AWAITING_EXPLICIT_RELEASE"
          execution_authorized=false
          if test "$GITHUB_EVENT_NAME" = "workflow_dispatch"; then
            release_state="EXPLICIT_RELEASE_REQUESTED"
            execution_authorized=true
          fi
          jq \
            --arg eventName "$GITHUB_EVENT_NAME" \
            --arg releaseState "$release_state" \
            --argjson executionAuthorized "$execution_authorized" \
            '{
              version:"backyrd-production-deployment-gate-audit-v1",
              eventName:$eventName,
              releaseState:$releaseState,
              executionAuthorized:$executionAuthorized,
              canonicalMainSha,
              baseSha,
              planHash,
              runtimeDeploymentRequired
            }' supabase-production-plan.json > supabase-production-gate.json
          jq '{canonicalMainSha,planHash,deployFunctions,migrations,pendingMigrations,preappliedMigrationImport,authConfig:(.authConfig|if . then {deploy,sha256} else null end),runtimeDeploymentRequired}' supabase-production-plan.json
          jq -r --slurpfile gate supabase-production-gate.json '"### Supabase Production Plan\n\n- Main SHA: `\(.canonicalMainSha)`\n- Plan: `\(.planHash)`\n- Functions: \(.deployFunctions|join(", ") // "none")\n- Migrations in canonical change: \(.migrations|length)\n- Pending migrations: \(.pendingMigrations|length)\n- Pre-applied migrations: \(.preappliedMigrationImport.migrations|length // 0)\n- Runtime deployment: \(.runtimeDeploymentRequired)\n- Release state: \($gate[0].releaseState)"' supabase-production-plan.json >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Production credentials and pending migration scope read-only
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions list --project-ref hjgcrrzfjchzqoegcywn --output json | jq -e '.[] | select(.slug=="decision-v13" and .status=="ACTIVE" and .verify_jwt==true)'
          supabase link --project-ref hjgcrrzfjchzqoegcywn
          supabase db push --dry-run 2>&1 | tee production-migration-dry-run.txt
          node scripts/deployment/verify-supabase-migration-dry-run.mjs supabase-production-plan.json production-migration-dry-run.txt
      - name: Retain deployment plan and gate audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supabase-production-plan-${{ inputs.canonical_main_sha || github.sha }}
          path: |
            supabase-production-plan.json
            supabase-production-gate.json
            production-migration-dry-run.txt
            manual-production-release.json
          if-no-files-found: error
          retention-days: 30

  production:
    name: Explicit canonical main production deploy
    if: github.event_name == 'workflow_dispatch' && inputs.release_confirmation == 'DEPLOY_SUPABASE_PRODUCTION'
    needs: deployment-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.canonical_main_sha }}
      - name: Refresh and revalidate canonical main release authority
        id: manual_release
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/deployment/verify-manual-production-release.mjs \
            --event-name "$GITHUB_EVENT_NAME" \
            --requested-sha "${{ inputs.canonical_main_sha }}" \
            --confirmation "${{ inputs.release_confirmation }}" \
            --output manual-production-release.json
          echo "base_sha=$(jq -r '.baseSha' manual-production-release.json)" >> "$GITHUB_OUTPUT"
      - name: Download the exact CI-certified Product artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backyrd-product-release-${{ inputs.canonical_main_sha }}
          path: ${{ runner.temp }}/product-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.certification_run_id }}
      - name: Reverify artifact immediately before deployment
        run: node scripts/ci/product-release-manifest.mjs verify --artifact "$RUNNER_TEMP/product-release" --expected-hash "${{ inputs.release_manifest_hash }}" --expected-source-sha "${{ inputs.canonical_main_sha }}" --expected-mode POST_MERGE_MAIN --checkout-root "$GITHUB_WORKSPACE"
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.98.2
      - name: Rebuild canonical-main deployment plan
        env:
          BASE_SHA: ${{ steps.manual_release.outputs.base_sha }}
          GITHUB_REF: refs/heads/main
          GITHUB_SHA: ${{ inputs.canonical_main_sha }}
        run: node scripts/deployment/supabase-production-plan.mjs --base-sha "$BASE_SHA" --head-sha HEAD --assert-canonical-main --output supabase-production-plan.json
      - name: Bind explicit release authority to immutable audit
        run: |
          mkdir -p deployment-audit
          cp manual-production-release.json deployment-audit/release-authority.json
      - name: Deploy exact bound Production scope
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_REF: refs/heads/main
          GITHUB_SHA: ${{ inputs.canonical_main_sha }}
          BACKYRD_PRODUCT_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/product-release
        run: bash scripts/deployment/deploy-supabase-production.sh supabase-production-plan.json
      - name: Publish deployment audit
        if: always()
        run: |
          test -f deployment-audit/result.json && jq . deployment-audit/result.json || true
          test -f deployment-audit/result.json && jq -r '"### Supabase Production Result\n\n- Result: \(.result)\n- Canonical main: `\(.canonicalMainSha // "no runtime deploy")`\n- Audit: `\(.auditHash // "not applicable")`"' deployment-audit/result.json >> "$GITHUB_STEP_SUMMARY" || true
      - name: Retain immutable deployment audit artifact
        if: always() && hashFiles('deployment-audit/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supabase-production-${{ inputs.canonical_main_sha }}
          path: deployment-audit/
          if-no-files-found: error
          retention-days: 90
