name: CI / Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  decision-lab-smoke:
    name: Decision Lab deterministic smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run decision-lab:test
      - run: npm run decision-lab:smoke
      - name: D2 framework acceptance
        run: npm run decision-lab:d2:acceptance
      - name: D2.1 freeze and readiness re-certification
        run: npm run decision-lab:d2:recertify
      - name: D2 protected-scope guard
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/decision-d2-scope-guard.sh

  repository-sanity:
    name: Repository sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate repository and migration structure
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci/repository-sanity.sh

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      NEXT_PUBLIC_APP_DOWNLOAD_URL: https://example.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck Web
        run: npm exec --workspace web tsc -- --noEmit --pretty false
      - name: Build Web
        run: npm run build --workspace web

  web-lint:
    name: Web lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run Web lint baseline
        id: lint
        continue-on-error: true
        run: npm run lint --workspace web
      - name: Record inherited Web lint debt
        if: steps.lint.outcome == 'failure'
        run: |
          echo "::warning::Web lint has inherited product-code findings; cleanup is tracked for Phase 2."
          echo "### Web lint advisory" >> "$GITHUB_STEP_SUMMARY"
          echo "Existing lint debt remains. This check becomes required after cleanup." >> "$GITHUB_STEP_SUMMARY"

  admin:
    name: Admin typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      NEXT_PUBLIC_GOOGLE_API_KEY: ci-public-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-server-placeholder
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - run: npm ci
      - name: Typecheck Admin
        run: npm exec tsc -- --noEmit --pretty false
      - name: Build Admin
        run: npm run build

  admin-lint:
    name: Admin lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - run: npm ci
      - name: Run Admin lint baseline
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Record inherited Admin lint debt
        if: steps.lint.outcome == 'failure'
        run: |
          echo "::warning::Admin lint has inherited product-code findings; cleanup is tracked for Phase 2."
          echo "### Admin lint advisory" >> "$GITHUB_STEP_SUMMARY"
          echo "Existing lint debt remains. This check becomes required after cleanup." >> "$GITHUB_STEP_SUMMARY"

  mobile-lint:
    name: Mobile lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint

  mobile-typecheck:
    name: Mobile typecheck (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Run Mobile TypeScript baseline
        id: typecheck
        continue-on-error: true
        run: npm exec tsc -- --noEmit --pretty false
      - name: Record inherited Mobile TypeScript debt
        if: steps.typecheck.outcome == 'failure'
        run: |
          echo "::warning::Mobile TypeScript has inherited findings; cleanup is tracked for Phase 2."
          echo "### Mobile TypeScript advisory" >> "$GITHUB_STEP_SUMMARY"
          echo "Existing type debt remains. This check becomes required after cleanup." >> "$GITHUB_STEP_SUMMARY"

  shared:
    name: Shared typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm exec tsc -- --noEmit --pretty false -p packages/shared/tsconfig.json
