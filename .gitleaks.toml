[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Historical generated shadow manifests used deterministic SHA-256 identity and evidence fingerprints, not credentials. Public manifests now omit them."
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^[0-9a-f]{64}$''']
  paths = ['''^docs/spot-intelligence/manifests/BASEL_(CANDIDATE_UNIVERSE|PILOT_SELECTION)_SHADOW_V1\.json$''']

  [[rules.allowlists]]
  description = "Founder Live gateway uses one explicit low-value deterministic idempotency fixture, not a credential."
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^idem-12345678$''']
  paths = ['''^mobile/packages/founder-live-control-plane/test/gateway\.test\.mjs$''']

  [[rules.allowlists]]
  description = "Product contract tests use visibly synthetic idempotency fixtures, never credentials."
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^idem-[0-9]{8}$''']
  paths = ['''^mobile/packages/(founder-live-control-plane|product-decision-contract)/test/control-plane\.test\.mjs$''']

  [[rules.allowlists]]
  description = "Product adapter test names the idempotency key version; the value is a public contract label."
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^idempotency-key-v1$''']
  paths = ['''^packages/decision-vnext-core/test/product-decision-production-adapter\.test\.mjs$''']
